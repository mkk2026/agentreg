version: 2

project_name: agentreg

before:
  hooks:
    - go mod tidy

builds:
  - id: agentctl
    main: .
    binary: agentctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/mkk2026/agentreg/cmd.version={{ .Version }}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: mkk2026
    name: agentreg

changelog:
  use: github
  sort: asc
