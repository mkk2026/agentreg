name: Bug report
description: Something isn't working the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. The more concrete this is, the faster it gets fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what went wrong?
      placeholder: I ran `agentctl find search` and ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, ideally copy-pasteable.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agentreg version
      description: Output of `agentctl --version`
      placeholder: agentctl version 0.1.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / arch
      placeholder: macOS 15 arm64 / Ubuntu 24.04 amd64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant daemon logs
      description: Anything the `agentctl serve` process printed.
      render: shell
