name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Please skim the [Roadmap](https://github.com/mkk2026/agentreg#roadmap) first — some things are deliberately deferred.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that agentreg makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like it to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Fit
      options:
        - label: This keeps the core lean (or fits behind an existing seam like the Verifier interface / labels), rather than bolting on a big new subsystem.
